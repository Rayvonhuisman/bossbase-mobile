# Controles voor elke pull request en elke push naar main of feature/pwa-web.
# Deze workflow bouwt en test alleen; deployen doet Vercel (zie docs/RELEASE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, feature/pwa-web]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Publieke clientconfiguratie; de echte anon-sleutel is hier niet nodig.
      # Nooit een service-role-sleutel in deze workflow.
      EXPO_PUBLIC_SUPABASE_URL: https://mawzqpnsluljxpbarhng.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run check:bundel
